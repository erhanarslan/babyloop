name: babyloop-ci

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: babyloop_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d babyloop_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/6333'"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
