name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloud Run production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      DEPLOY_ENVIRONMENT: production
      DEPLOY_TOPOLOGY: ${{ vars.DEPLOY_TOPOLOGY }}
      GCP_PROJECT_ID: babyloop-staging
      EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
      GCP_BUILD_CONFIRM: BUILD_PRODUCTION
      GCP_SECRET_IMPORT_CONFIRM: SECRET_IMPORT_PRODUCTION
      GCP_DEPLOY_CONFIRM: DEPLOY_PRODUCTION
      GCP_MIGRATION_CONFIRM: APPLY_PRODUCTION
      BABYLOOP_GCP_ARTIFACT_ROOT: .release/gcp
      DEPLOY_RELEASE_CONTRACT_PATH: .release/gcp/production/resolved-release-contract.json
      CURRENT_RUNTIME_IDENTIFIER_INVENTORY_JSON: ${{ vars.CURRENT_RUNTIME_IDENTIFIER_INVENTORY_JSON }}
      PROVIDER_IDENTIFIER_MIGRATION_CONFIRM: ${{ vars.PROVIDER_IDENTIFIER_MIGRATION_CONFIRM }}
      WORKER_IDENTIFIER_MIGRATION_EVIDENCE_JSON: ${{ vars.WORKER_IDENTIFIER_MIGRATION_EVIDENCE_JSON }}

    steps:
      - name: Guard production source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          test "${{ vars.PRODUCTION_RELEASE_APPROVED }}" = "true"
          test "$DEPLOY_TOPOLOGY" = "single_environment"
          test "$GCP_PROJECT_ID" = "babyloop-staging"
          test -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          test -n "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"
          test -n "$EXPECTED_DATABASE_NAME"
          test -n "$CURRENT_RUNTIME_IDENTIFIER_INVENTORY_JSON"

      - name: Prepare backup directories
        run: |
          set -euo pipefail
          backup_output_dir="$RUNNER_TEMP/babyloop-backups/production"
          backup_replica_dir="$RUNNER_TEMP/babyloop-backups/production-replica"
          mkdir -p "$backup_output_dir" "$backup_replica_dir"
          {
            echo "BACKUP_OUTPUT_DIR=$backup_output_dir"
            echo "BACKUP_REPLICA_DIR=$backup_replica_dir"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backup encryption tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age
          age --version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pin gcloud context
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud config set run/region europe-west1

      - name: Materialize protected runtime contract
        env:
          RUNTIME_ENV_FILE: ${{ secrets.RUNTIME_ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$RUNTIME_ENV_FILE"
          runtime_path="$RUNNER_TEMP/babyloop-runtime-production.env"
          printf '%s\n' "$RUNTIME_ENV_FILE" > "$runtime_path"
          chmod 600 "$runtime_path"
          inventory_path="$RUNNER_TEMP/babyloop-current-runtime-identifiers.json"
          printf '%s\n' "$CURRENT_RUNTIME_IDENTIFIER_INVENTORY_JSON" > "$inventory_path"
          chmod 600 "$inventory_path"
          inventory_checksum="$(sha256sum "$inventory_path" | awk '{print $1}')"
          printf '%s  %s\n' "$inventory_checksum" "$(basename "$inventory_path")" > "$inventory_path.sha256"
          {
            echo "DEPLOY_ENV_FILE=$runtime_path"
            echo "CURRENT_RUNTIME_IDENTIFIER_INVENTORY_PATH=$inventory_path"
          } >> "$GITHUB_ENV"
          if [ -n "$WORKER_IDENTIFIER_MIGRATION_EVIDENCE_JSON" ]; then
            worker_evidence_path="$RUNNER_TEMP/babyloop-worker-identifier-migration-evidence.json"
            printf '%s\n' "$WORKER_IDENTIFIER_MIGRATION_EVIDENCE_JSON" > "$worker_evidence_path"
            chmod 600 "$worker_evidence_path"
            worker_evidence_checksum="$(sha256sum "$worker_evidence_path" | awk '{print $1}')"
            printf '%s  %s\n' "$worker_evidence_checksum" "$(basename "$worker_evidence_path")" > "$worker_evidence_path.sha256"
            echo "WORKER_IDENTIFIER_MIGRATION_EVIDENCE_PATH=$worker_evidence_path" >> "$GITHUB_ENV"
          fi

      - name: Audit runtime contract
        run: pnpm deploy:runtime-env:audit -- --target=production --env-file="$DEPLOY_ENV_FILE" --output=.release/gcp/production/runtime-env-audit.json

      - name: Production release rehearsal preflight
        run: pnpm deploy:rehearse:production -- --env-file="$DEPLOY_ENV_FILE" --live-read-only=true

      - name: Import pinned Secret Manager versions
        run: pnpm gcp:cloud-run:secrets -- --environment=production --env-file="$DEPLOY_ENV_FILE"

      - name: Build immutable production images
        run: pnpm gcp:cloud-run:build -- --environment=production --env-file="$DEPLOY_ENV_FILE"

      - name: Resolve immutable production images
        id: images
        run: |
          set -euo pipefail
          manifest=".release/gcp/production/cloud-run-image-manifest.json"
          for target in api web backoffice; do
            image="$(jq -r ".images.$target" "$manifest")"
            case "$image" in
              *@sha256:*) ;;
              *) echo "$target image is not digest-pinned" >&2; exit 1 ;;
            esac
            echo "$target=$image" >> "$GITHUB_OUTPUT"
          done

      - name: Report API image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api }}
          format: sarif
          output: .release/gcp/production/api-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Report web image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.web }}
          format: sarif
          output: .release/gcp/production/web-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Report backoffice image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backoffice }}
          format: sarif
          output: .release/gcp/production/backoffice-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Summarize production vulnerability policy
        run: |
          {
            echo "### Production image vulnerability policy"
            echo
            echo "- Environment: \`production\`"
            echo "- API digest: \`${{ steps.images.outputs.api }}\`"
            echo "- Web digest: \`${{ steps.images.outputs.web }}\`"
            echo "- Backoffice digest: \`${{ steps.images.outputs.backoffice }}\`"
            echo "- HIGH and CRITICAL findings are preserved in SARIF artifacts."
            echo "- HIGH findings are non-blocking; fixable CRITICAL findings block deployment."
            echo "- Unfixed CRITICAL findings remain visible in SARIF evidence."
            echo "- Reporting scans completed against immutable digests built in the single production registry."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce API critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api }}
          format: table
          output: .release/gcp/production/api-trivy-critical.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Enforce web critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.web }}
          format: table
          output: .release/gcp/production/web-trivy-critical.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Enforce backoffice critical vulnerability policy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backoffice }}
          format: table
          output: .release/gcp/production/backoffice-trivy-critical.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Capture previous Cloud Run revisions
        run: node scripts/deploy/capture-cloud-run-rollback.mjs --environment=production

      - name: Production database preflight
        env:
          DATABASE_RELEASE_EVIDENCE_PATH: .release/gcp/production/database-preflight.json
        run: node --env-file="$DEPLOY_ENV_FILE" scripts/ops/database-release-safety.mjs --phase=preflight

      - name: Mandatory encrypted backup
        run: node --env-file="$DEPLOY_ENV_FILE" scripts/ops/postgres-backup.mjs

      - name: Deploy migration job only
        run: pnpm gcp:cloud-run:deploy -- --environment=production --phase=migration

      - name: Execute production migration
        run: pnpm gcp:cloud-run:migrate -- --environment=production

      - name: Production database postflight
        env:
          DATABASE_RELEASE_EVIDENCE_PATH: .release/gcp/production/database-postflight.json
        run: node --env-file="$DEPLOY_ENV_FILE" scripts/ops/database-release-safety.mjs --phase=postflight

      - name: Mark service mutation boundary
        run: touch .release/gcp/production/services-mutation-started

      - name: Deploy production services and workers
        run: pnpm gcp:cloud-run:deploy -- --environment=production --phase=services

      - name: Resolve release contract
        run: pnpm deploy:release-contract -- --environment=production --env-file="$DEPLOY_ENV_FILE"

      - name: Production smoke
        run: node --env-file="$DEPLOY_ENV_FILE" scripts/deploy/run-environment-smoke.mjs production

      - name: Record immutable deployment metadata
        run: pnpm deploy:release-metadata

      - name: Roll back Cloud Run traffic after failure
        if: failure()
        continue-on-error: true
        run: pnpm deploy:release-rollback -- --environment=production

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: |
            .release
            ${{ env.BACKUP_REPLICA_DIR }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: node scripts/deploy/write-release-summary.mjs

  release:
    name: GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create dated release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="babyloop-v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --repo="$GITHUB_REPOSITORY" --target="$GITHUB_SHA" --generate-notes --title="$tag"
          echo "Created release \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
