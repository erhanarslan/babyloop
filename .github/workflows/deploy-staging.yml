name: Validate staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: validate-staging
  cancel-in-progress: true

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  validate:
    name: Release candidate validation
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENVIRONMENT: staging
      DEPLOY_TOPOLOGY: single_environment

    steps:
      - name: Guard staging validation source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/staging"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare validation evidence directory
        run: mkdir -p .release/evidence

      - name: Static staging release rehearsal
        run: pnpm deploy:rehearse:staging -- --live-read-only=false

      - name: Validate deployment boundaries
        run: |
          set -euo pipefail
          pnpm security:staging-deployment
          pnpm security:gcp-cloud-run
          pnpm security:deployment-command-safety

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-validation-${{ github.sha }}
          path: .release/evidence
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
