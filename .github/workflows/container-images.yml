name: Container images

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Public build-time environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: container-images-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, backoffice]
    env:
      PUBLIC_API_BASE_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_PUBLIC_API_BASE_URL || vars.STAGING_PUBLIC_API_BASE_URL }}
      PUBLIC_SITE_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_PUBLIC_SITE_URL || vars.STAGING_PUBLIC_SITE_URL }}
      PUBLIC_BACKOFFICE_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_PUBLIC_BACKOFFICE_URL || vars.STAGING_PUBLIC_BACKOFFICE_URL }}
      LEGAL_OPERATOR_NAME: ${{ vars.LEGAL_OPERATOR_NAME }}
      LEGAL_CONTACT_EMAIL: ${{ vars.LEGAL_CONTACT_EMAIL }}
      LEGAL_CONTACT_ADDRESS: ${{ vars.LEGAL_CONTACT_ADDRESS }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate release environment
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            staging|production) ;;
            *) echo "environment must be staging or production" >&2; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public build variables
        if: matrix.target != 'api'
        run: |
          test -n "$PUBLIC_API_BASE_URL"
          if [ "${{ matrix.target }}" = "web" ]; then
            test -n "$PUBLIC_SITE_URL"
            test -n "$PUBLIC_BACKOFFICE_URL"
            test -n "$LEGAL_OPERATOR_NAME"
            test -n "$LEGAL_CONTACT_EMAIL"
            test -n "$LEGAL_CONTACT_ADDRESS"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}:${{ inputs.environment }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BACKOFFICE_BASE_URL=${{ env.PUBLIC_BACKOFFICE_URL }}
            NEXT_PUBLIC_LEGAL_OPERATOR_NAME=${{ env.LEGAL_OPERATOR_NAME }}
            NEXT_PUBLIC_LEGAL_CONTACT_EMAIL=${{ env.LEGAL_CONTACT_EMAIL }}
            NEXT_PUBLIC_LEGAL_CONTACT_ADDRESS=${{ env.LEGAL_CONTACT_ADDRESS }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image
        run: echo "ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write image digest metadata
        run: |
          mkdir -p image-digest
          cat > "image-digest/${{ matrix.target }}.json" <<JSON
          {
            "target": "${{ matrix.target }}",
            "image": "ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "gitSha": "${{ github.sha }}",
            "environment": "${{ inputs.environment }}"
          }
          JSON

      - name: Upload image digest metadata
        uses: actions/upload-artifact@v4
        with:
          name: babyloop-image-${{ matrix.target }}-${{ github.sha }}
          path: image-digest/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Report immutable image vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: image-digest/${{ matrix.target }}-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Enforce critical vulnerability policy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}@${{ steps.build.outputs.digest }}
          format: table
          output: image-digest/${{ matrix.target }}-trivy-critical.txt
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Summarize image vulnerability policy
        if: always()
        run: |
          {
            echo "### ${{ matrix.target }} image vulnerability policy"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/babyloop-${{ matrix.target }}@${{ steps.build.outputs.digest }}\`"
            echo "- HIGH findings are reported without blocking."
            echo "- CRITICAL findings block image acceptance."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babyloop-image-scan-${{ matrix.target }}-${{ github.sha }}
          path: |
            image-digest/${{ matrix.target }}-trivy.sarif
            image-digest/${{ matrix.target }}-trivy-critical.txt
          if-no-files-found: ignore
          retention-days: 14

  manifest:
    name: Assemble immutable image manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Download image digest metadata
        uses: actions/download-artifact@v4
        with:
          pattern: babyloop-image-*-${{ github.sha }}
          merge-multiple: true
          path: image-digests

      - name: Assemble checksum-protected image manifest
        env:
          IMAGE_MANIFEST_INPUT_DIR: image-digests
          IMAGE_MANIFEST_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_MANIFEST_GIT_SHA: ${{ github.sha }}
          IMAGE_MANIFEST_OUTPUT_PATH: container-image-manifest.json
        run: node scripts/deploy/assemble-image-manifest.mjs

      - name: Upload immutable image manifest
        uses: actions/upload-artifact@v4
        with:
          name: babyloop-container-image-manifest-${{ inputs.environment }}-${{ github.sha }}
          path: |
            container-image-manifest.json
            container-image-manifest.json.sha256
          if-no-files-found: error
          retention-days: 14
